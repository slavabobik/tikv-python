name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Blocking client is regenerated from the asyncio one
        run: uv run python scripts/unasync.py --check

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  test-oldest:
    name: Test (oldest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"
      - run: uv sync --resolution lowest-direct
      - run: uv pip list
      - run: uv run pytest

  integration:
    name: Integration (TiKV ${{ matrix.tikv }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tikv: [v7.5.8, v8.5.8]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Start PD and TiKV
        run: ci/start-cluster.sh ${{ matrix.tikv }}
      - name: Run integration tests
        env:
          TIKV_PD_ENDPOINTS: 127.0.0.1:2379
        run: uv run pytest -m integration -v
      - name: Cluster logs
        if: failure()
        run: |
          docker logs --tail 200 tikv-ci-pd
          docker logs --tail 200 tikv-ci-tikv

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Wheel installs and imports in a clean environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "import tikv; print(tikv.__version__, tikv.RawClient)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
