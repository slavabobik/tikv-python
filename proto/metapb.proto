// Subset of pingcap/kvproto `metapb.proto` used by the raw client.
//
// Package, message names and field numbers MUST stay identical to upstream:
// they define the wire format. Fields the client never reads are omitted;
// protobuf keeps them as unknown fields, so nothing is lost on the wire.
// Upstream: https://github.com/pingcap/kvproto/blob/master/proto/metapb.proto

syntax = "proto3";
package metapb;

message Region {
  uint64 id = 1;
  // Region key range [start_key, end_key). An empty end_key means +inf.
  bytes start_key = 2;
  bytes end_key = 3;
  RegionEpoch region_epoch = 4;
  repeated Peer peers = 5;
  bool is_in_flashback = 7;
  uint64 flashback_start_ts = 8;
}

message RegionEpoch {
  // Conf change version, auto increment when add or remove peer.
  uint64 conf_ver = 1;
  // Region version, auto increment when split or merge.
  uint64 version = 2;
}

enum PeerRole {
  Voter = 0;
  Learner = 1;
  IncomingVoter = 2;
  DemotingVoter = 3;
}

message Peer {
  uint64 id = 1;
  uint64 store_id = 2;
  PeerRole role = 3;
  bool is_witness = 4;
}

enum StoreState {
  Up = 0;
  Offline = 1;
  Tombstone = 2;
}

message StoreLabel {
  string key = 1;
  string value = 2;
}

message Store {
  uint64 id = 1;
  // Address to handle client requests (kv, cop, etc.).
  string address = 2;
  StoreState state = 3;
  repeated StoreLabel labels = 4;
  string version = 5;
  string peer_address = 6;
  string status_address = 7;
}
