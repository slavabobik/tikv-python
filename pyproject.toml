[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tikv-python"
dynamic = ["version"]
description = "Pure-Python client for TiKV's raw key-value API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Slava Bobik" }]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]
keywords = ["tikv", "pd", "key-value", "database", "grpc", "asyncio", "rawkv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/slavabobik/tikv-python"
Documentation = "https://github.com/slavabobik/tikv-python#readme"
Issues = "https://github.com/slavabobik/tikv-python/issues"
Changelog = "https://github.com/slavabobik/tikv-python/releases"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-protobuf",
]

[tool.hatch.version]
path = "src/tikv/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tikv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real cluster (set TIKV_PD_ENDPOINTS)"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/tikv/_proto"]

[tool.ruff.format]
exclude = [
    # Generated by scripts/unasync.py from their formatted _async counterparts.
    "src/tikv/_sync/_client.py",
    "src/tikv/_sync/_pd.py",
    "src/tikv/_sync/_transport.py",
    # Documentation examples use aligned comments.
    "*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "A", "C4", "PT"]

[tool.mypy]
strict = true
files = ["src/tikv"]
exclude = ["src/tikv/_proto/"]

[[tool.mypy.overrides]]
module = ["tikv._proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-builtins]
# tikv.TimeoutError deliberately subclasses (and so stands in for) the builtin.
builtins-ignorelist = ["TimeoutError"]

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/unasync.py, which renames imports without re-sorting them.
"src/tikv/_sync/*" = ["I001", "UP028"]
